spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
  datasource:
    # Testcontainers-JDBC-URL: startet beim ersten Zugriff einen echten PostgreSQL-Container
    # (dieselbe Version wie in docker-compose.yml). TC_DAEMON=true: ein Container für den ganzen Testlauf.
    url: jdbc:tc:postgresql:15-alpine:///thesis404?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    # Die Tests nutzen dieselben Flyway-Migrationen wie Produktion – kein separates Test-Schema mehr.
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  security:
    admin-ids: "99999"
