# Docker Engine 29 akzeptiert nur noch API-Version >= 1.44.
# Testcontainers 1.x (Spring Boot 3.5) fragt standardmäßig mit einer älteren Version an und wird abgelehnt
# ("Could not find a valid Docker environment"). Diese Datei legt die API-Version fest.
# Kann entfernt werden, sobald das Projekt Testcontainers 2.x nutzt (z. B. mit Spring Boot 4).
api.version=1.44
