logging:
  level:
    org:
      springframework:
        security: info

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/thesis404}
    username: thesisuser
    password: thesis404pass

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${CLIENT_ID:__MISSING_CLIENT_ID__}
            client-secret: ${CLIENT_SECRET:__MISSING_CLIENT_SECRET__}
            scope: read:user

app:
  storage:
    # Hier landen hochgeladene Dateien (PDF, ZIP, MD). In Produktion auf ein persistentes Volume zeigen lassen.
    verzeichnis: ${UPLOAD_DIR:./data/uploads}
  security:
    admin-ids: ${ADMIN_IDS:}
