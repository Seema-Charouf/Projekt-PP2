<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alle Themen – Game of Advisor</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
  <link rel="stylesheet" th:href="@{/css/404.css}">
  <link rel="stylesheet" th:href="@{/css/studi.css}">
</head>
<body class="bg-light">

<header>
  <div class="topnav">
    <a class="logo">Game of Advisor</a>
    <a th:href="@{/homestudi}">Home</a>
    <a th:href="@{/homestudi/themen}" class="active split">Zu allen Themen</a>
  </div>
</header>

<div class="container mt-4 mb-4">
  <h1 class="mb-4">Alle Themen</h1>

  <div th:if="${info}" class="alert alert-success mb-2" th:text="${info}">Info</div>
  <div th:if="${error}" class="alert alert-danger mb-2" th:text="${error}">Fehler</div>

  <div class="studi-card">
    <p class="text-muted mb-3" th:if="${themesWithOwner != null and !#lists.isEmpty(themesWithOwner)}">
      <span th:text="${#lists.size(themesWithOwner)}">0</span> Thema/Themen gefunden.
    </p>
    <ul class="list-group list-group-flush" th:if="${themesWithOwner != null and !#lists.isEmpty(themesWithOwner)}">
      <li th:each="two : ${themesWithOwner}" class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="d-flex flex-column">
          <span class="fw-semibold" th:text="${two.theme.titel}">Thema</span>
          <span class="text-muted small" th:text="|Betreuer/in: ${two.ownerName}|">Betreuer/in</span>
        </span>
        <span class="d-flex align-items-center gap-2">
          <span class="badge bg-secondary" th:if="${two.theme.angeforderteVeranstaltungen != null and !#lists.isEmpty(two.theme.angeforderteVeranstaltungen)}"
                th:text="|${#lists.size(two.theme.angeforderteVeranstaltungen)} Modul(e)|">Modul(e)</span>
          <th:block th:if="${isLoggedIn}">
            <th:block th:if="${requestedThemeIds != null and requestedThemeIds.contains(two.theme.id.toString())}">
              <span class="badge bg-success">Anfrage gesendet</span>
            </th:block>
            <th:block th:unless="${requestedThemeIds != null and requestedThemeIds.contains(two.theme.id.toString())}">
              <form th:action="@{/homestudi/request/{tid}(tid=${two.theme.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-primary">Thema anfragen</button>
              </form>
            </th:block>
          </th:block>
          <span th:unless="${isLoggedIn}" class="text-muted small">Bitte einloggen, um anzufragen.</span>
        </span>
      </li>
    </ul>
    <div th:if="${themesWithOwner == null or #lists.isEmpty(themesWithOwner)}" class="alert alert-info mb-0">
      Keine Themen vorhanden.
    </div>
  </div>

  <div class="mt-3">
    <a th:href="@{/homestudi}" class="btn btn-outline-primary">Zurück zur Betreuer-Suche</a>
  </div>
</div>

<script th:src="@{/js/bootstrap.bundle.js}"></script>
</body>
</html>
