<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thema bearbeiten</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.css}" href="../static/css/bootstrap.css">
  <link rel="stylesheet" th:href="@{/css/404.css}" href="../static/css/404.css">
</head>
<body class="bg-light">

<header>
  <div class="topnav">
    <a class="logo">Game of Advisors</a>
    <a th:href="@{/betreuerProfil}">Home</a>
  </div>
</header>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Thema bearbeiten</h4>
        </div>
        <div class="card-body">
          <div th:replace="~{fragments/theme-form :: themeForm(
            title='Thema bearbeiten',
            actionUrl=@{/betreuerProfil/editTheme/{id}(id=${themeId})},
            submitLabel='Speichern',
            editMode=true,
            themeId=${themeId}
          )}"></div>

          <hr class="my-4">

          
          <section class="mb-4">
            <h5 class="mb-3">Angeforderte Veranstaltungen</h5>

            
            <div th:if="${allVeranstaltungen != null and !#lists.isEmpty(allVeranstaltungen)}" class="mb-3">
              <form th:action="@{/betreuerProfil/editTheme/{id}/addVeranstaltung(id=${themeId})}" 
                    th:object="${requiredModuleForm}" 
                    method="post" 
                    class="d-flex align-items-center gap-2">
                <label for="veranstaltungSelect" class="form-label fw-bold mb-0">Neue Veranstaltung wählen:</label>
                <select id="veranstaltungSelect" th:field="*{selectedFachgebiet}" class="form-select" style="max-width: 300px;">
                  <option value="">-- Bitte wählen --</option>
                  <option th:each="v : ${allVeranstaltungen}" th:value="${v.name()}" th:text="${v.name()}">Veranstaltung</option>
                </select>
                <button type="submit" class="btn btn-primary">Hinzufügen</button>
              </form>
            </div>

            
            <ul class="list-group" th:if="${theme != null and theme.angeforderteVeranstaltungen != null and !#lists.isEmpty(theme.angeforderteVeranstaltungen)}">
              <li th:each="veranstaltung : ${theme.angeforderteVeranstaltungen}" class="list-group-item d-flex justify-content-between align-items-center">
                <span th:text="${veranstaltung.name()}">Veranstaltung</span>
                <a th:href="@{/betreuerProfil/editTheme/{id}/deleteVeranstaltung(id=${themeId}, veranstaltungToDelete=${veranstaltung.name()})}"
                   class="btn btn-outline-danger btn-sm"
                   onclick="return confirm('Sind Sie sicher, dass Sie diese Veranstaltung entfernen möchten?')">Löschen</a>
              </li>
            </ul>
            <div th:if="${theme == null or theme.angeforderteVeranstaltungen == null or #lists.isEmpty(theme.angeforderteVeranstaltungen)}" class="alert alert-info">
              Keine Veranstaltungen vorhanden
            </div>
          </section>

          
          <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/betreuerProfil}" class="btn btn-outline-secondary">Abbrechen</a>
            <div>
              <a th:href="@{/betreuerProfil/deleteTheme/{id}(id=${themeId})}"
                 class="btn btn-outline-danger me-2"
                 onclick="return confirm('Sind Sie sicher, dass Sie dieses Thema löschen möchten?')">Löschen</a>
              <button type="submit" form="themeForm" class="btn btn-primary">Speichern</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/bootstrap.bundle.js}"></script>
</body>
</html>
