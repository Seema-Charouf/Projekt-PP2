<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Users</title>

    
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="btn btn-outline-primary me-2" th:href="@{/admin}">Admin</a>
        <a class="btn btn-outline-danger" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container d-flex justify-content-center">
    <div class="card shadow-sm p-4" style="max-width: 500px; width: 100%;">
        <h3 class="text-center mb-4">User hinzufügen</h3>

        <form method="post" th:action="@{/addusers}" th:object="${addUserForm}">

            <div class="mb-3">
                <label for="githubid" class="form-label">GitHub Benutzername</label>
                <input id="githubid"
                       type="text"
                       class="form-control"
                       placeholder="Max-Mustermann"
                       th:field="*{githubid}" >

                <div class="text-danger small"
                     th:if="${#fields.hasErrors('githubid')}"
                     th:errors="*{githubid}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Rolle auswählen</label>
                <select id="role" class="form-select" th:field="*{role}">
                    <option th:value="STUDENT">Student</option>
                    <option th:value="BETREUER">Betreuer</option>
                </select>

                <div class="text-danger small"
                     th:if="${#fields.hasErrors('role')}"
                     th:errors="*{role}">
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">Hinzufügen</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
