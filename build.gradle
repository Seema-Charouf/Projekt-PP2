plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.0.9'
    id 'jacoco'
}

group = 'dse'
version = '0.0.1-SNAPSHOT'
description = 'thesis-404'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

jacoco {
    toolVersion = "0.8.12"
}

// Klassen ohne eigene Logik bzw. nur für die lokale Entwicklung zählen nicht zur Abdeckung
def coverageAusnahmen = [
        'dse/thesis404/Thesis404Application*',
        'dse/thesis404/infrastructure/config/TestDataInitializer*',
        'dse/thesis404/infrastructure/web/form/**',
]

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageAusnahmen)
        }))
    }
}

// Der Build schlägt fehl, wenn die Testabdeckung unter die Mindestgrenze fällt.
// Startwert bewusst vorsichtig – nach dem ersten Lauf im Bericht nachsehen und schrittweise erhöhen.
jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageAusnahmen)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotbugsMain {
    ignoreFailures = true  // Report erstellen, Build nicht blockieren
    reports {
        html.required = true
        xml.required = true
    }
}
spotbugsTest {
    ignoreFailures = true
    reports {
        html.required = true
        xml.required = true
    }
}
